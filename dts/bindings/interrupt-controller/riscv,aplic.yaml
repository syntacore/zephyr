description: RICS-V advanced platform-level interrupt controller

compatible: "riscv,aplic"

include: [interrupt-controller.yaml, base.yaml]

properties:
  reg:
    required: true

  riscv,max-priority:
    type: int
    description: Maximum interrupt priority.
    required: true

  riscv,num-sources:
    type: int
    description: Number of wired interrupts supported by this APLIC domain.
    required: true

  "#interrupt-cells":
    const: 2

interrupt-cells:
  - irq
  - priority