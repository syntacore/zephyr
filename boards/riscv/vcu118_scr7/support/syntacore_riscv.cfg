proc init_targets {} {
	adapter speed 2000                                                                             

	reset_config none                                                                             

	jtag newtap scr_core0 cpu -irlen 5                                                           
	jtag newtap scr_core1 cpu -irlen 5                                                           
	jtag newtap scr_core2 cpu -irlen 5                                                           
	jtag newtap scr_core3 cpu -irlen 5                                                           

	target create scr_core0.cpu riscv -endian little -chain-position scr_core0.cpu -coreid 0    
	scr_core0.cpu configure -rtos hwthread                                                       
	scr_core0.cpu configure -work-area-phys 0x3fc0000 -work-area-size 0x10000 -work-area-backup 1
	scr_core0.cpu riscv expose_csrs 3008-3015,4033-4034                                          

	target create scr_core1.cpu riscv -endian little -chain-position scr_core1.cpu -coreid 1    
	scr_core1.cpu configure -rtos hwthread                                                       
	scr_core1.cpu configure -work-area-phys 0x3fd0000 -work-area-size 0x10000 -work-area-backup 1
	scr_core1.cpu riscv expose_csrs 3008-3015,4033-4034                                          

	target create scr_core2.cpu riscv -endian little -chain-position scr_core2.cpu -coreid 2    
	scr_core2.cpu configure -rtos hwthread                                                       
	scr_core2.cpu configure -work-area-phys 0x3fe0000 -work-area-size 0x10000 -work-area-backup 1
	scr_core2.cpu riscv expose_csrs 3008-3015,4033-4034                                          

	target create scr_core3.cpu riscv -endian little -chain-position scr_core3.cpu -coreid 3    
	scr_core3.cpu configure -rtos hwthread                                                       
	scr_core3.cpu configure -work-area-phys 0x3ff0000 -work-area-size 0x10000 -work-area-backup 1
	scr_core3.cpu riscv expose_csrs 3008-3015,4033-4034                                          

	target smp scr_core0.cpu scr_core1.cpu scr_core2.cpu scr_core3.cpu
}